<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스케줄 관리 - Shuttle-roid 운행 관제 시스템</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/schedule.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header th:replace="~{ header.html::header }"></header>
<nav th:replace="~{ nav.html::navbar }"></nav>

<main>
  <section class="schedule-section">
    <div class="section-header">
      <h2>배차 정보</h2>
    </div>

    <!-- Added tabs for weekday and holiday schedules -->
    <div class="schedule-tabs">
      <button class="tab-button active">평일 스케줄</button>
    </div>

    <!-- Weekday schedule table -->
    <div id="weekday-schedule" class="tab-content">
      <div class="table-container">
        <table class="schedule-table">
          <thead>
          <tr>
            <th>코스명</th>
            <th>차량번호</th>
            <th>운전자</th>
            <th>시작노선</th>
            <th>마지막노선</th>
            <th>출발시간</th>
            <th>종료시간</th>
            <th>상태</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="schedule : ${Schedules}">
            <td>
              <input type="hidden" class="schedule-id" th:value="${schedule.scheduleId}" />
              <span th:text="${schedule.courseNum}">101-001</span>
            </td>
            <!-- 차량번호 select -->
            <td>
              <select class="vehicle-select" disabled>
                <option th:each="v : ${Vehicles}"
                        th:value="${v.vehicleId}"
                        th:selected="${v.vehicleNumber == schedule.vehicleNum}"
                        th:text="${v.vehicleNumber}"></option>
              </select>
            </td>

            <!-- 운전자 select -->
            <td>
              <select class="driver-select" disabled>

                <option th:each="d : ${Drivers}"
                        th:value="${d.driverId}"
                        th:selected="${d.driverName == schedule.driverName}"
                        th:text="${d.driverName}"></option>
              </select>
            </td>
<!--            <td th:text="${schedule.vehicleNum}">12가3456</td>-->
<!--            <td th:text="${schedule.driverName}">홍길동</td>-->
            <td th:text="${schedule.startRoute}">순천향대 정문</td>
            <td th:text="${schedule.endRoute}">아산역</td>
            <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">08:00</td>
            <td th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">09:30</td>
            <td>
                                <span class="status-badge"
                                      th:classappend="${schedule.status.name() == 'READY'} ? 'status-scheduled' :
                                                      (${schedule.status.name() == 'IN_PROGRESS'} ? 'status-progress' :
                                                      (${schedule.status.name() == 'COMPLETED'} ? 'status-completed' : 'status-cancelled'))"
                                      th:text="${schedule.status.name() == 'READY'} ? '예정' :
                                               (${schedule.status.name() == 'IN_PROGRESS'} ? '운행중' :
                                               (${schedule.status.name() == 'COMPLETED'} ? '완료' : '취소'))">
                                    예정
                                </span>
            </td>

            <!-- 수정 버튼 -->
            <td>
              <button class="edit-btn">수정</button>
              <button class="save-btn" style="display:none;">저장</button>
            </td>

          </tr>
          <tr th:if="${#lists.isEmpty(Schedules)}">
            <td colspan="8" class="empty-message">등록된 평일 스케줄이 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="schedule-tabs">
      <button class="tab-button active" >주말/공휴일 스케줄</button>
    </div>

    <!-- Holiday schedule table -->
    <div id="holiday-schedule" class="tab-content">
      <div class="table-container">
        <table class="schedule-table">
          <thead>
          <tr>
            <th>코스명</th>
            <th>차량번호</th>
            <th>운전자</th>
            <th>시작노선</th>
            <th>마지막노선</th>
            <th>출발시간</th>
            <th>종료시간</th>
            <th>상태</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="schedule : ${HolidaySchedules}">
            <td>
              <input type="hidden" class="schedule-id" th:value="${HolidaySchedules.scheduleId}" />
              <span th:text="${schedule.courseNum}">101-002</span>
            </td>
            <!-- 차량번호 select -->
            <td>
              <select class="vehicle-select" disabled>
                <option th:each="v : ${Vehicles}"
                        th:value="${v.vehicleId}"
                        th:selected="${v.vehicleNumber == schedule.vehicleNum}"
                        th:text="${v.vehicleNumber}"></option>
              </select>
            </td>

            <!-- 운전자 select -->
            <td>
              <select class="driver-select" disabled>

                <option th:each="d : ${Drivers}"
                        th:value="${d.driverId}"
                        th:selected="${d.driverName == schedule.driverName}"
                        th:text="${d.driverName}"></option>
              </select>
            </td>
<!--            <td th:text="${schedule.vehicleNum}">12가7890</td>-->
<!--            <td th:text="${schedule.driverName}">김철수</td>-->
            <td th:text="${schedule.startRoute}">순천향대 정문</td>
            <td th:text="${schedule.endRoute}">아산역</td>
            <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">09:00</td>
            <td th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">10:30</td>
            <td>
                                <span class="status-badge"
                                      th:classappend="${schedule.status.name() == 'READY'} ? 'status-scheduled' :
                                                      (${schedule.status.name() == 'IN_PROGRESS'} ? 'status-progress' :
                                                      (${schedule.status.name() == 'COMPLETED'} ? 'status-completed' : 'status-cancelled'))"
                                      th:text="${schedule.status.name() == 'READY'} ? '예정' :
                                               (${schedule.status.name() == 'IN_PROGRESS'} ? '운행중' :
                                               (${schedule.status.name() == 'COMPLETED'} ? '완료' : '취소'))">
                                    예정
                                </span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(HolidaySchedules)}">
            <td colspan="8" class="empty-message">등록된 주말/공휴일 스케줄이 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <aside th:replace="~{ aside.html::aside }"></aside>
</main>

<footer th:replace="~{ footer.html::footer }"></footer>


<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".edit-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const row = btn.closest("tr");
        const selects = row.querySelectorAll("select");
        selects.forEach(s => s.disabled = false);

        btn.style.display = "none";
        row.querySelector(".save-btn").style.display = "inline-block";
      });
    });

    document.querySelectorAll(".save-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const row = btn.closest("tr");
        const vehicleId = row.querySelector(".vehicle-select").value;
        const driverId = row.querySelector(".driver-select").value;
        const scheduleId = row.querySelector(".schedule-id").value;
        console.log(vehicleId, driverId, scheduleId);

        const payload = {
          scheduleId,
          vehicleId,
          driverId
        };

        const response = await fetch("/schedule/modify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("수정 완료");
          row.querySelectorAll("select").forEach(s => s.disabled = true);
          btn.style.display = "none";
          row.querySelector(".edit-btn").style.display = "inline-block";
        } else {
          alert("수정 실패");
        }
      });
    });
  });
</script>

<script>
  function switchTab(tabName) {
    // Remove active class from all tabs and contents
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    // Add active class to selected tab and content
    if (tabName === 'weekday') {
      document.querySelector('.tab-button:first-child').classList.add('active');
      document.getElementById('weekday-schedule').classList.add('active');
    } else {
      document.querySelector('.tab-button:last-child').classList.add('active');
      document.getElementById('holiday-schedule').classList.add('active');
    }
  }
</script>

</body>
</html>
