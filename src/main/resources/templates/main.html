<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuttle-roid 업체 정보 관리 - 운행 관제 시스템</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header th:replace="~{ header.html::header }"></header>

<nav th:replace="~{ nav.html::navbar }"></nav>

<main>
    <section class="dashboard">
        <div class="dashboard-header">
            <h2>금일 운행 현황</h2>
            <div class="date-selector">
                <button><i class="fas fa-calendar-alt"></i> 오늘</button>
            </div>
        </div>

        <div class="operation-table">
            <h3>실시간 운행 현황</h3>
            <table>
                <thead>
                <tr>
                    <th>코스명</th>
                    <th>차량번호</th>
                    <th>기사명</th>
                    <th>현재노선명</th>
                    <th>이전정류소</th>
                    <th>현재정류소</th>
                    <th>다음정류소</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="realTime : ${RealTimeOpr}">
                    <td th:text="${realTime.courseName}">코스명</td>
                    <td th:text="${realTime.vehicleNum}">차량번호</td>
                    <td th:text="${realTime.driverName}">기사명</td>
                    <td th:text="${realTime.currentRoute}">현재노선명</td>
                    <td th:text="${realTime.previousStop}">이전정류소</td>
                    <td th:text="${realTime.currentStop}">현재정류소</td>
                    <td th:text="${realTime.nextStop}">다음정류소</td>
                    <td>
                        <span class="status"
                              th:classappend="${realTime.routeStatus.name() == 'DEPARTURE'} ? 'departure' :
                                             (${realTime.routeStatus.name() == 'APPROACH'} ? 'approach' :
                                             (${realTime.routeStatus.name() == 'ARRIVAL'} ? 'arrival' : 'ready'))"
                              th:text="${realTime.routeStatus.name() == 'DEPARTURE'} ? '출발' :
                                       (${realTime.routeStatus.name() == 'APPROACH'} ? '접근' :
                                       (${realTime.routeStatus.name() == 'ARRIVAL'} ? '도착' : '운행준비'))">
                            상태
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(RealTimeOpr)}">
                    <td colspan="8" style="text-align: center; padding: 2rem; color: #999;">
                        현재 운행 중인 차량이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="operation-table">
            <h3>금일 배차 정보</h3>
            <table>
                <thead>
                <tr>
                    <th>코스번호</th>
                    <th>차량번호</th>
                    <th>기사명</th>
                    <th>출발노선</th>
                    <th>마지막노선</th>
                    <th>출발시간</th>
                    <th>종료예정</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="schedule : ${DailySchedules}">
                    <td th:text="${schedule.courseNum}">코스번호</td>
                    <td th:text="${schedule.vehicleNum}">차량번호</td>
                    <td th:text="${schedule.driverName}">기사명</td>
                    <td th:text="${schedule.startRoute}">출발노선</td>
                    <td th:text="${schedule.endRoute}">마지막노선</td>
                    <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">출발시간</td>
                    <td th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">종료예정</td>
                    <td>
                        <span class="status"
                              th:classappend="${schedule.status.name() == 'SCHEDULED'} ? 'scheduled' :
                                             (${schedule.status.name() == 'IN_PROGRESS'} ? 'on-time' :
                                             (${schedule.status.name() == 'COMPLETED'} ? 'completed' : 'cancelled'))"
                              th:text="${schedule.status.name() == 'READY'} ? '예정' :
                                       (${schedule.status.name() == 'IN_PROGRESS'} ? '운행중' :
                                       (${schedule.status.name() == 'COMPLETED'} ? '완료' : '취소'))">
                            상태
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(DailySchedules)}">
                    <td colspan="8" style="text-align: center; padding: 2rem; color: #999;">
                        금일 배차 정보가 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <aside th:replace="~{ aside.html::aside }"></aside>
</main>

<footer th:replace="~{ footer.html::footer}"></footer>

<script>
    // 현재 날짜와 시간 표시 함수
    function updateDateTime() {
        const now = new Date();
        const options = {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long',
            hour: '2-digit',
            minute: '2-digit'
        };
        const datetimeElement = document.getElementById('datetime');
        if (datetimeElement) {
            datetimeElement.textContent = now.toLocaleDateString('ko-KR', options);
        }
    }

    // 페이지 로드 시 시간 표시 및 1분마다 업데이트
    updateDateTime();
    setInterval(updateDateTime, 60000);
</script>
</body>
</html>
