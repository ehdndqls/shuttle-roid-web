<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노선 관리</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/route-management.css">
</head>
<body>

<header th:replace="~{ header.html::header }"></header>
<nav th:replace="~{ nav.html::navbar }"></nav>

<main>
    <section class="route-management">
        <div class="section-header">
            <h2>노선 관리</h2>
            <div class="action-buttons">
                <a href="/routes/modify?routeId=0" id="addRouteBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 노선 추가
                </a>
            </div>
        </div>

        <div class="route-container">
            <!-- 노선 목록 섹션 -->
            <div class="route-list-section">
                <!-- 검색 및 필터 -->
                <form id="searchForm" action="/routes/search" method="get" class="search-filter">
                    <div class="search-box">
                        <input type="text" placeholder="노선명 또는 번호로 검색..." id="searchInput">
                        <button type="submit" class="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div class="filter-options">
                        <select id="routeTypeFilter" name="routeType">
                            <option value="">전체 타입</option>
                            <option value="CIRCULAR">순환</option>
                            <option value="ONE_WAY">편도</option>
                            <option value="ROUND_TRIP">왕복</option>
                        </select>
                    </div>
                </form>


                <!-- 노선 목록 -->
                <div class="route-list" id="routeList">
                    <!-- 노선 카드들이 JavaScript로 동적 생성됩니다 -->
                </div>
            </div>

            <!-- 정류소 목록 섹션 -->
            <div class="route-stops-section">
                <div class="route-stops-header">
                    <h3 id="selectedRouteName">노선을 선택해주세요</h3>
                    <div class="route-actions" id="routeActions" style="display: none;">
                        <a href="#" id="editRouteBtn" class="btn btn-secondary">
                            <i class="fas fa-edit"></i> 수정
                        </a>
                        <button id="deleteRouteBtn" class="btn btn-danger">
                            <i class="fas fa-trash-alt"></i> 삭제
                        </button>
                    </div>
                </div>

                <!-- 선택된 노선이 없을 때 -->
                <div class="no-route-selected" id="noRouteSelected">
                    <div class="empty-state">
                        <i class="fas fa-route"></i>
                        <p>왼쪽에서 노선을 선택하면<br>정류소 정보가 표시됩니다.</p>
                    </div>
                </div>

                <!-- 노선 정보 카드 (선택시 표시) -->
                <div class="route-info-card" id="routeInfoCard" style="display: none;">
                    <div class="route-info-item">
                        <div class="info-label">노선 ID</div>
                        <div class="info-value" id="routeId">-</div>
                    </div>
                    <div class="route-info-item">
                        <div class="info-label">노선 번호</div>
                        <div class="info-value" id="routeNum">-</div>
                    </div>
                    <div class="route-info-item">
                        <div class="info-label">노선명</div>
                        <div class="info-value" id="routeName">-</div>
                    </div>
                    <div class="route-info-item">
                        <div class="info-label">노선 타입</div>
                        <div class="info-value">
                            <span class="route-type-badge" id="routeTypeBadge">-</span>
                        </div>
                    </div>
                    <div class="route-info-item">
                        <div class="info-label">예상 소요시간</div>
                        <div class="info-value" id="estimatedTime">-</div>
                    </div>
                </div>

                <!-- 정류소 목록 시각화 (선택시 표시) -->
                <div class="route-stops-visual" id="routeStopsVisual" style="display: none;">
                    <div class="route-line" id="routeLine"></div>
                    <div class="route-stops" id="routeStops">
                        <!-- 정류소 목록이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>
        <aside th:replace="~{ aside.html::aside }"></aside>
    </section>

</main>
<footer th:replace="~{ footer.html::footer }"></footer>

<script th:inline="javascript">
    /*<![CDATA[*/
    const routesData = /*[[${routes}]]*/ [];
    /*]]>*/
</script>

<script>

    let selectedRouteIndex = null;

    document.addEventListener('DOMContentLoaded', function() {
        renderRouteList(routesData);
    });

    function renderRouteList(routes) {
        const routeListContainer = document.getElementById('routeList');
        routeListContainer.innerHTML = '';

        routes.forEach((route, index) => {
            const routeCard = createRouteCard(route, index);
            routeListContainer.appendChild(routeCard);
        });
    }

    function createRouteCard(route, index) {
        const routeCard = document.createElement('div');
        routeCard.className = 'route-card';
        routeCard.onclick = () => selectRoute(index);

        const routeTypeClass = getRouteTypeClass(route.routeType);
        const routeTypeText = getRouteTypeText(route.routeType);

        const stopList = route.stopList ?? [];
        const firstStop = route.stopList[0]?.name || '';
        const lastStop = route.stopList[route.stopList.length - 1]?.name || '';

        routeCard.innerHTML = `
                <div class="route-card-header">
                    <h3>${route.routeNum}번 노선</h3>
                    <span class="route-type ${routeTypeClass}">${routeTypeText}</span>
                </div>
                <div class="route-card-body">
                    <div class="route-info">
                        <div class="route-points">
                            <div class="route-point">
                                <i class="fas fa-map-marker-alt"></i>
                                ${firstStop} ${route.routeType === 'ROUND_TRIP' ? '↔' : '→'} ${lastStop}
                            </div>
                        </div>
                        <div class="route-stats">
                            <span><i class="fas fa-clock"></i> ${route.estimatedTime}</span>
                            <span><i class="fas fa-bus-alt"></i> ${route.stopList.length}개 정류소</span>
                        </div>
                    </div>
                </div>
            `;

        return routeCard;
    }

    function selectRoute(index) {
        // 이전 선택 해제
        document.querySelectorAll('.route-card').forEach(card => {
            card.classList.remove('selected');
        });

        // 새로운 선택
        document.querySelectorAll('.route-card')[index].classList.add('selected');
        selectedRouteIndex = index;

        // 노선 정보 표시
        displayRouteInfo(routesData[index]);
    }

    function displayRouteInfo(route) {
        // 빈 상태 숨기기
        document.getElementById('noRouteSelected').style.display = 'none';

        // 노선 정보 카드 표시
        document.getElementById('routeInfoCard').style.display = 'grid';
        document.getElementById('routeStopsVisual').style.display = 'block';

        // 헤더 업데이트
        document.getElementById('selectedRouteName').textContent = `${route.routeNum}번 ${route.routeName}`;

        // 노선 정보 업데이트
        document.getElementById('routeId').textContent = `${route.id.routeId}`;
        document.getElementById('routeNum').textContent = route.routeNum;
        document.getElementById('routeName').textContent = route.routeName;
        document.getElementById('estimatedTime').textContent = route.estimatedTime;

        // 노선 타입 배지 업데이트
        const typeBadge = document.getElementById('routeTypeBadge');
        typeBadge.textContent = getRouteTypeText(route.routeType);
        typeBadge.className = `route-type-badge ${getRouteTypeClass(route.routeType)}`;

        // 노선 라인 스타일 업데이트
        const routeLine = document.getElementById('routeLine');
        if (route.routeType === 'CIRCULAR') {
            routeLine.className = 'route-line circular-line';
        } else {
            routeLine.className = 'route-line';
        }

        // 정류소 목록 업데이트
        displayStops(route.stopList);
    }

    function displayStops(stops) {
        const stopsContainer = document.getElementById('routeStops');
        stopsContainer.innerHTML = '';

        stops.forEach((stop, index) => {
            const stopElement = document.createElement('div');
            stopElement.className = 'route-stop';

            let markerClass = 'stop-marker';
            if (index === 0) markerClass += ' start-stop';
            else if (index === stops.length - 1) markerClass += ' end-stop';

            stopElement.innerHTML = `
                    <div class="${markerClass}">
                        ${index + 1}
                    </div>
                    <div class="stop-info">
                        <div class="stop-name">${stop.name}</div>
                        <div class="stop-details">${stop.details}</div>
                    </div>
                `;

            stopsContainer.appendChild(stopElement);
        });
    }

    function getRouteTypeClass(type) {
        const typeMap = {
            'CIRCULAR': 'circular',
            'ONE_WAY': 'one-way',
            'ROUND_TRIP': 'round-trip'
        };
        return typeMap[type] || 'circular';
    }

    function getRouteTypeText(type) {
        const typeMap = {
            'CIRCULAR': '순환',
            'ONE_WAY': '편도',
            'ROUND_TRIP': '왕복'
        };
        return typeMap[type] || type;
    }

    // 검색 기능
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        filterRoutes();
    });

    // 필터 기능
    document.getElementById('routeTypeFilter').addEventListener('change', function(e) {
        filterRoutes();
    });

    function filterRoutes() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filterType = document.getElementById('routeTypeFilter').value;

        const filteredRoutes = routesData.filter(route => {
            const matchesSearch = route.routeName.toLowerCase().includes(searchTerm) ||
                route.routeNum.includes(searchTerm);
            const matchesFilter = !filterType || route.routeType === filterType;

            return matchesSearch && matchesFilter;
        });

        renderRouteList(filteredRoutes);

        // 선택된 노선이 필터링되면 선택 해제
        if (selectedRouteIndex !== null && !filteredRoutes.includes(routesData[selectedRouteIndex])) {
            selectedRouteIndex = null;
            document.getElementById('noRouteSelected').style.display = 'flex';
            document.getElementById('routeInfoCard').style.display = 'none';
            document.getElementById('routeStopsVisual').style.display = 'none';
            document.getElementById('selectedRouteName').textContent = '노선을 선택해주세요';
        }
    }
</script>
</body>
</html>
